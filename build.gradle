plugins {
    id 'java'
    id 'maven-publish'
}

group = "com.teremu.appsamsunga7"
version = "1.0.0"

publishing {
    publications {
        appSamsungA7(MavenPublication) {
            from components.java
            artifactId = "appsamsunga7-base"
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/teremu/AppSamsungA7")
            credentials {
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
    }
}
