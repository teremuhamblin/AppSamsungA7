name: CI - AppSamsungA7 Base

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  base-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Base Build Check
        run: echo "Structure v1.0 OK — aucun module Android présent."
