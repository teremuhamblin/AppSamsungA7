name: CI - AppSamsungA7 Base

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  base-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Base Build Check
        run: echo "Structure v1.0 OK — aucun module Android présent."

  stateless-token-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Use GitHub Token
        run: |
          echo "Token récupéré via GITHUB_TOKEN."
          TOKEN="${{ secrets.GITHUB_TOKEN }}"
          echo "Longueur du token : ${#TOKEN}"

      - name: Test Stateless Header
        run: |
          echo "Test du header stateless..."
          curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Stateless-Token: true" \
            https://api.github.com/user
